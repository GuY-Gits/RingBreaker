[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ringbreaker"
version = "0.1.0"
description = "RingBreaker: Real-time fraud ring detection, graph analysis, adaptive action scoring, and analyst explainability platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.2",
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.3",
    "xgboost>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["ringbreaker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
