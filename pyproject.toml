[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ringbreaker"
version = "0.1.0"
description = "RingBreaker Person 2: transaction/identity graphs, temporal features, and named pattern detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.2",
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["ringbreaker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
